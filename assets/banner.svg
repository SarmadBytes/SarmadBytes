<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Sarmad Ahsan — OpenShift Consultant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#14304f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb6c6"/>
      <stop offset="1" stop-color="#7c9cff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="18" fill="url(#grid)"/>

  <!-- cluster motif: control plane + workers + GPU node -->
  <g transform="translate(905,58)" fill="none" stroke-width="2">
    <g stroke="#3fb6c6" stroke-opacity="0.55">
      <line x1="150" y1="40" x2="60" y2="120"/><line x1="150" y1="40" x2="150" y2="120"/><line x1="150" y1="40" x2="240" y2="120"/>
      <line x1="60" y1="120" x2="150" y2="120"/><line x1="150" y1="120" x2="240" y2="120"/>
      <line x1="60" y1="120" x2="105" y2="185"/><line x1="240" y1="120" x2="195" y2="185"/>
    </g>
    <rect x="122" y="14" width="56" height="52" rx="10" fill="#0b1626" stroke="#7c9cff"/>
    <text x="150" y="46" fill="#cfe0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">CP</text>
    <g fill="#0b1626" stroke="#3fb6c6">
      <rect x="36" y="100" width="48" height="40" rx="8"/><rect x="126" y="100" width="48" height="40" rx="8"/><rect x="216" y="100" width="48" height="40" rx="8"/>
      <rect x="81" y="168" width="48" height="36" rx="8"/>
    </g>
    <rect x="171" y="168" width="48" height="36" rx="8" fill="#0b1626" stroke="#76b900"/>
    <text x="195" y="191" fill="#a9e06a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">GPU</text>
  </g>

  <text x="64" y="104" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700">Sarmad Ahsan</text>
  <rect x="64" y="122" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="170" fill="#cfe0ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">OpenShift Consultant</text>
  <text x="64" y="208" fill="#9fb3cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19">Production Red Hat OpenShift for regulated industries — banking · telecom</text>
  <text x="64" y="240" fill="#9fb3cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19">ACM · ACS · ODF · GitOps · Day-2 operations — with OpenShift AI &amp; NVIDIA GPU on top</text>
</svg>
